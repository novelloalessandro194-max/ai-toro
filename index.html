<!-- Schermata del Minigioco (Inizialmente nascosta) -->
<div id="game-screen" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#050505; font-family:sans-serif; z-index:9998; overflow:hidden; padding:20px; box-sizing:border-box;">
    
    <!-- Testo Superiore Richiesto -->
    <div style="text-align:center; margin-top:20px;">
        <h2 style="color:#ff1e1e; font-size:24px; letter-spacing:3px; text-transform:uppercase; margin:0; font-weight:900;">Sconfiggi i mostri</h2>
        <p id="game-subtitle" style="color:#666; font-size:12px; margin-top:5px; text-transform:uppercase; letter-spacing:1px;">Elimina le anomalie per sbloccare il menu</p>
    </div>

    <!-- Arena di Gioco Centrale -->
    <div id="arena" style="width:100%; height:45%; margin:40px auto 0 auto; background:#0c0c0c; border:2px solid #222; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden;">
        <!-- Mostro Attivo -->
        <div id="monster-target" style="color:#ff1e1e; font-size:18px; font-weight:bold; letter-spacing:2px; border:1px solid #ff1e1e; padding:10px 20px; background:rgba(255,30,30,0.05); border-radius:4px; text-transform:uppercase; transition: all 0.2s;">
            OMBRA: DUBBIO
        </div>
        <!-- Indicatore HP del Mostro -->
        <div style="width:60%; height:4px; background:#1a1a1a; margin-top:15px; border-radius:2px; overflow:hidden;">
            <div id="monster-hp" style="width:100%; height:100%; background:#ff1e1e; transition: width 0.2s;"></div>
        </div>
    </div>

    <!-- Console dei Pulsanti Inferiore -->
    <div style="position:absolute; bottom:40px; left:0; width:100%; padding:0 20px; box-sizing:border-box; display:flex; flex-direction:column; gap:12px;">
        
        <!-- Tasto Attacco Principale -->
        <button onclick="handleAction('attacco')" style="background:#ff1e1e; color:#fff; border:none; padding:16px; font-size:16px; font-weight:bold; text-transform:uppercase; letter-spacing:2px; border-radius:6px; cursor:pointer; box-shadow: 0 4px 10px rgba(255,30,30,0.3); transition: transform 0.1s;">
            ATTACCO ⚔️
        </button>
        
        <!-- Doppi Pulsanti Laterali (Difesa e Scatto) -->
        <div style="display:flex; gap:12px;">
            <button onclick="handleAction('difesa')" style="flex:1; background:#222; color:#aaa; border:1px solid #444; padding:14px; font-size:14px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; border-radius:6px; cursor:pointer;">
                DIFESA 🛡️
            </button>
            <button onclick="handleAction('scatto')" style="flex:1; background:#00d2ff; color:#000; border:none; padding:14px; font-size:14px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; border-radius:6px; cursor:pointer; box-shadow: 0 4px 10px rgba(0,210,255,0.2);">
                SCATTO ⚡
            </button>
        </div>
    </div>
</div>

<script>
let currentPhase = 'dubbio'; // Fasi: dubbio -> pigrizia -> porta
let monsterHP = 100;

function handleAction(type) {
    const target = document.getElementById('monster-target');
    const hpBar = document.getElementById('monster-hp');
    const subtitle = document.getElementById('game-subtitle');
    const arena = document.getElementById('arena');

    // Effetto vibrazione visiva all'azione
    arena.style.transform = `translate(${(Math.random()*4)-2}px, ${(Math.random()*4)-2}px)`;
    setTimeout(() => arena.style.transform = 'none', 100);

    if (currentPhase === 'dubbio' || currentPhase === 'pigrizia') {
        if (type === 'attacco') {
            monsterHP -= 34; // 3 colpi per uccidere il mostro
            if (monsterHP < 0) monsterHP = 0;
            hpBar.style.width = monsterHP + '%';

            if (monsterHP <= 0) {
                if (currentPhase === 'dubbio') {
                    // Passa al secondo mostro
                    currentPhase = 'pigrizia';
                    monsterHP = 100;
                    hpBar.style.width = '100%';
                    target.innerHTML = "OMBRA: PIGRIZIA";
                } else {
                    // Entrambi i mostri sconfitti, compare la porta blindata
                    currentPhase = 'porta';
                    hpBar.parentElement.style.display = 'none';
                    target.innerHTML = "PORTA BLINDATA CORE";
                    target.style.color = "#00d2ff";
                    target.style.borderColor = "#00d2ff";
                    target.style.background = "rgba(0,210,255,0.05)";
                    subtitle.innerHTML = "Usa lo scatto per distruggere la barriera";
                }
            }
        }
    } else if (currentPhase === 'porta') {
        if (type === 'scatto') {
            // Animazione di sfondamento finale
            arena.style.background = '#00d2ff';
            target.innerHTML = "[PORTA DISTRUTTA]";
            setTimeout(() => {
                document.getElementById('game-screen').style.display = 'none';
                // Sblocca il menu principale dell'applicazione reale
                alert("ACCESSO AL MENU PRINCIPALE AUTORIZZATO.");
            }, 800);
        }
    }
}

// Funzione da chiamare quando finisce il quiz per avviare il gioco
function startMinigame() {
    document.getElementById('game-screen').style.display = 'block';
}
</script>
