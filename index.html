<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ToRØ App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1, h2 {
            color: #ffcc00;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffcc00;
            color: #121212;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e6b800;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .chat-box {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            padding: 10px;
            background-color: #1a1a1a;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .msg {
            margin-bottom: 8px;
            padding: 6px;
            border-radius: 4px;
            background-color: #2d2d2d;
        }
        .vip {
            border-left: 4px solid #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI ToRØ Premium</h1>
        <p style="text-align: center;">Accedi ai Rank d Elite e sblocca il Badge Hardcore per 3,99€ al mese.</p>
        <button id="checkout-btn">Abbonati Ora - 3,99€</button>
        <p id="payment-status" style="text-align: center; color: #ffcc00;"></p>
    </div>

    <div class="container">
        <h2>Community Chat</h2>
        <div class="chat-box" id="chat-box"></div>
        <input type="text" id="username-input" placeholder="Il tuo Username">
        <textarea id="message-input" placeholder="Scrivi un messaggio..."></textarea>
        <button id="send-btn">Invia Messaggio</button>
    </div>

    <script>
        // Sostituisci questo URL con l'indirizzo reale del tuo server attivo su Render
        const SERVER_URL = 'https://IL_TUO_SERVER_SU_://onrender.com';

        // GESTIONE PAGAMENTO STRIPE
        document.getElementById('checkout-btn').addEventListener('click', async () => {
            const statusText = document.getElementById('payment-status');
            statusText.innerText = 'Generazione del link di pagamento...';
            
            try {
                const response = await fetch(`${SERVER_URL}/api/monetizzazione/checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    statusText.innerText = 'Errore nella creazione della sessione.';
                }
            } catch (err) {
                statusText.innerText = 'Impossibile connettersi al server.';
                console.error(err);
            }
        });

        // GESTIONE INVIO MESSAGGIO NELLA CHAT
        document.getElementById('send-btn').addEventListener('click', async () => {
            const username = document.getElementById('username-input').value.trim();
            const messaggio = document.getElementById('message-input').value.trim();
            const chatBox = document.getElementById('chat-box');

            if (!username || !messaggio) {
                alert('Inserisci sia username che messaggio.');
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/api/community/invia`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        utente_id: '00000000-0000-0000-0000-000000000000', // ID di test
                        username: username,
                        messaggio: messaggio,
                        is_vip: false
                    })
                });

                const data = await response.json();

                if (response.status === 400 && data.status === 'blocked') {
                    // Gestione blocco hater
                    alert(data.coach_msg);
                    return;
                }

                if (response.ok) {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'msg';
                    msgDiv.innerHTML = `<strong>${username}:</strong> ${messaggio}`;
                    chatBox.appendChild(msgDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                    document.getElementById('message-input').value = '';
                } else {
                    alert('Errore durante l\'invio del messaggio.');
                }
            } catch (err) {
                alert('Errore di connessione al server.');
                console.error(err);
            }
        });
    </script>
</body>
</html>
