<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ToRØ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: #000; color: #FFF; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #phone { width: 380px; height: 680px; background: #0B0C10; border: 2px solid #1F2833; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); position: relative; }
        #stats { height: 60px; border-bottom: 1px solid #1F2833; display: flex; justify-content: center; align-items: center; background: #0B0C10; }
        #stats h1 { color: #66FCF1; font-size: 24px; font-weight: bold; letter-spacing: 3px; text-transform: uppercase; }
        #content { flex: 1; padding: 30px; display: flex; flex-direction: column; justify-content: center; background: #000; position: relative; }
        .btn-premium { background: #FFD700; color: #000; border: none; padding: 18px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; font-size: 15px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); border-radius: 4px; margin-top: 20px; }
        .btn-premium:hover { background: #FFF; box-shadow: 0 0 25px #FFF; color: #000; }
        #payment-status { text-align: center; margin-top: 30px; color: #ffcc00; font-size: 12px; line-height: 1.4; font-weight: bold; }
        #error-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 99; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        #error-overlay p { color: #FF0055; font-size: 13px; margin-bottom: 25px; line-height: 1.5; font-weight: bold; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="phone">
    <!-- Intestazione focalizzata solo sul brand -->
    <div id="stats">
        <h1>AI ToRØ</h1>
    </div>
    
    <div id="content">
        <!-- Schermata di blocco se il server è offline -->
        <div id="error-overlay">
            <p>CONNESSIONE AL SERVER ASSENTE.<br>RIPROVA TRA QUALCHE ISTANTE.</p>
            <button style="background:#1F2833; color:#66FCF1; border:1px solid #66FCF1; padding:12px 24px; cursor:pointer; font-weight:bold; font-family:'Courier New', monospace; letter-spacing:1px;" onclick="controllaServer()">RICONNETTI</button>
        </div>

        <!-- Contenuto principale pulito senza distrazioni -->
        <button class="btn-premium" onclick="pagaAbbonamento()">Attiva Abbonamento (3,99€)</button>
        <p id="payment-status"></p>
    </div>
</div>

<script>
    const SERVER_URL = 'https://ai-toro.onrender.com';

    async function controllaServer() {
        const overlay = document.getElementById('error-overlay');
        try {
            const res = await fetch(SERVER_URL + '/');
            if (res.ok) { 
                overlay.style.display = 'none'; 
            } else {
                overlay.style.display = 'flex';
            }
        } catch(e) { 
            overlay.style.display = 'flex'; 
        }
    }
    controllaServer();

    async function pagaAbbonamento() {
        const statusText = document.getElementById('payment-status');
        statusText.innerText = "REINDIRIZZAMENTO VERSO STRIPE...";
        try {
            const res = await fetch(`${SERVER_URL}/api/monetizzazione/checkout`, { method: 'POST' });
            const data = await res.json();
            if(data.url) { window.location.href = data.url; } 
            else { statusText.innerText = "ERRORE DI CONFIGURAZIONE DEL SERVER."; }
        } catch(e) { statusText.innerText = "ERRORE DI CONNESSIONE. VERIFICA IL SERVER."; }
    }
</script>
</body>
</html>
